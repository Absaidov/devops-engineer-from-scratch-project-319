---
- name: Validate Loki configuration
  ansible.builtin.assert:
    that:
      - loki_image is match('^grafana/loki:[0-9]+\.[0-9]+\.[0-9]+$')
      - loki_bind_address | trim | length > 0
      - loki_bind_address != '0.0.0.0'
      - loki_bind_address != '::'
      - loki_port | int > 0
      - loki_port | int <= 65535
      - loki_container_port | int > 0
      - loki_container_port | int <= 65535
      - loki_allowed_cidrs is sequence
      - loki_allowed_cidrs is not string
      - loki_allowed_cidrs | length > 0
      - "'0.0.0.0/0' not in loki_allowed_cidrs"
      - "'::/0' not in loki_allowed_cidrs"
      - loki_retention_period | trim | length > 0
      - loki_schema_from is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}$')
    fail_msg: >-
      Use a pinned Loki image, valid ports and retention settings, bind Loki
      to the monitoring VM private address, and allow only private CIDRs.

- name: Allow Loki ingestion from the application server
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    port: "{{ loki_port | string }}"
    from_ip: "{{ item }}"
    comment: Loki ingestion from Promtail
  loop: "{{ loki_allowed_cidrs }}"

- name: Create the Loki configuration directory
  ansible.builtin.file:
    path: "{{ loki_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the persistent Loki data directory
  ansible.builtin.file:
    path: "{{ loki_data_dir }}"
    state: directory
    owner: "{{ loki_container_uid }}"
    group: "{{ loki_container_gid }}"
    mode: "0750"

- name: Render the Loki configuration
  ansible.builtin.template:
    src: loki.yml.j2
    dest: "{{ loki_config_path }}"
    owner: root
    group: "{{ loki_container_gid }}"
    mode: "0640"
  register: loki_config_result

- name: Pull the pinned Loki image if it is missing
  community.docker.docker_image_pull:
    name: "{{ loki_image }}"
    pull: not_present

- name: Validate the rendered Loki configuration
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --volume
      - "{{ loki_config_dir }}:/etc/loki:ro"
      - --volume
      - "{{ loki_data_dir }}:/loki"
      - "{{ loki_image }}"
      - "-config.file=/etc/loki/{{ loki_config_filename }}"
      - -verify-config=true
  changed_when: false

- name: Ensure the monitoring Docker network exists for Loki
  community.docker.docker_network:
    name: "{{ loki_network_name }}"
    state: present

- name: Start or update the Loki container
  community.docker.docker_container:
    name: "{{ loki_container_name }}"
    image: "{{ loki_image }}"
    state: started
    recreate: "{{ loki_config_result.changed }}"
    pull: missing
    detach: true
    restart_policy: unless-stopped
    stop_timeout: 30
    command:
      - "-config.file=/etc/loki/{{ loki_config_filename }}"
    command_handling: correct
    published_ports:
      - >-
        {{ loki_bind_address }}:{{ loki_port }}:{{ loki_container_port }}
    volumes:
      - "{{ loki_config_dir }}:/etc/loki:ro"
      - "{{ loki_data_dir }}:/loki"
    networks:
      - name: "{{ loki_network_name }}"
    comparisons:
      networks: strict
      volumes: strict
    log_driver: json-file
    log_options:
      max-size: 10m
      max-file: "3"

- name: Wait for Loki to become ready
  ansible.builtin.uri:
    url: "http://{{ loki_bind_address }}:{{ loki_port }}/ready"
    method: GET
    status_code: 200
    timeout: 5
  register: loki_readiness_check
  until: (loki_readiness_check.status | default(0)) == 200
  retries: "{{ loki_readiness_retries }}"
  delay: "{{ loki_readiness_delay }}"
  changed_when: false

- name: Verify the Loki build information endpoint
  ansible.builtin.uri:
    url: >-
      http://{{ loki_bind_address }}:{{ loki_port }}/loki/api/v1/status/buildinfo
    method: GET
    status_code: 200
    return_content: true
    timeout: 5
  register: loki_buildinfo_check
  failed_when: >-
    loki_buildinfo_check.status != 200
    or (loki_buildinfo_check.json.version | default('') | length == 0)
  changed_when: false
