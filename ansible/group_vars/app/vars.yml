---
deploy_domain: uit14.ru
deploy_domains:
  - "{{ deploy_domain }}"
  - "www.{{ deploy_domain }}"
deploy_bind_address: 127.0.0.1
deploy_ssh_port: 22
deploy_application_port: 8080
deploy_management_port: 9090
deploy_management_backend_port: 19090
deploy_spring_profile: prod
nginx_http_port: 80
nginx_https_port: 443

# The monitoring VM addresses are read from inventory. If the monitoring group
# is not present yet, metrics stay closed to remote hosts.
monitoring_allowed_cidrs: >-
  {{
    groups.get('monitoring', [])
    | map('extract', hostvars, 'private_ip')
    | map('regex_replace', '$', '/32')
    | list
  }}
monitoring_proxy_bind_address: 0.0.0.0
monitoring_basic_auth_file: /etc/nginx/.htpasswd-monitoring

nginx_stub_status_path: /nginx_status
nginx_exporter_image: nginx/nginx-prometheus-exporter:1.5.1
nginx_exporter_listen_address: 0.0.0.0

# Promtail tails only the current application container JSON log and the
# structured Nginx log files. Loki is reached over the private VPC address.
promtail_image: grafana/promtail:3.6.11
promtail_container_name: promtail
promtail_config_dir: /etc/promtail
promtail_config_filename: promtail.yml
promtail_config_path: "{{ promtail_config_dir }}/{{ promtail_config_filename }}"
promtail_positions_dir: /var/lib/promtail
promtail_positions_file: "{{ promtail_positions_dir }}/positions.yml"
promtail_container_port: 9080
promtail_bind_address: 127.0.0.1
promtail_port: 9080
promtail_environment: "{{ deploy_spring_profile }}"
promtail_host_label: "{{ inventory_hostname }}"
promtail_loki_push_url: >-
  http://{{ hostvars[groups['monitoring'][0]].private_ip }}:{{
    hostvars[groups['monitoring'][0]].loki_port
  }}/loki/api/v1/push
promtail_readiness_retries: 30
promtail_readiness_delay: 2

node_exporter_listen_address: 0.0.0.0
node_exporter_enabled_collectors:
  - systemd
  - processes
node_exporter_extra_arguments:
  - --collector.systemd.enable-restarts-metrics

deploy_registry_url: cr.yandex
deploy_registry_username: json_key
deploy_container_name: project-devops-deploy
deploy_image_repository: cr.yandex/crphrkv4imihhuukiv7q/project-devops-deploy
deploy_image_tag: a100ed36995989034cee26c2cfd9e1558201bdaa
deploy_image: "{{ deploy_image_repository }}:{{ deploy_image_tag }}"

deploy_db_host: rc1a-ths7ptdlvrtqlvfl.mdb.yandexcloud.net
deploy_db_port: 6432
deploy_db_name: bulletins
deploy_db_ssl_mode: disable
deploy_db_url: >-
  jdbc:postgresql://{{ deploy_db_host }}:{{ deploy_db_port }}/{{ deploy_db_name }}?sslmode={{ deploy_db_ssl_mode }}

deploy_s3_bucket: uit14-bulletins-images
deploy_s3_region: ru-central1
deploy_s3_endpoint: https://storage.yandexcloud.net

nginx_remove_default_vhost: true
nginx_server_tokens: "off"
nginx_client_max_body_size: 10m
nginx_proxy_cache_path: >-
  /var/cache/nginx levels=1:2 keys_zone=static_cache:10m
  max_size=200m inactive=7d use_temp_path=off
nginx_json_access_log_path: /var/log/nginx/access-json.log
nginx_management_access_log_path: /var/log/nginx/management-access-json.log
nginx_json_error_log_path: /var/log/nginx/error-json.ndjson
nginx_access_log: >-
  {{ nginx_json_access_log_path }} main buffer=16k flush=1s
nginx_error_log: >-
  syslog:server=unix:/dev/log,facility=local7,tag=nginx_error warn
nginx_log_format: |-
  escape=json
  '{'
  '"timestamp":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"remote_user":"$remote_user",'
  '"request":"$request",'
  '"status":$status,'
  '"body_bytes_sent":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"upstream_status":"$upstream_status",'
  '"upstream_response_time":"$upstream_response_time",'
  '"http_referer":"$http_referer",'
  '"http_user_agent":"$http_user_agent",'
  '"request_id":"$request_id"'
  '}'
nginx_application_vhosts:
  - server_name: "{{ deploy_domains | join(' ') }}"
    filename: project-devops-deploy.conf
    template: "{{ playbook_dir }}/../templates/project-devops-deploy.conf.j2"
  - server_name: "{{ deploy_domains | join(' ') }}"
    filename: project-devops-deploy-https.conf
    state: absent

certbot_install_method: package
certbot_create_if_missing: true
certbot_create_method: webroot
certbot_webroot: /var/www/letsencrypt
certbot_auto_renew: true
certbot_auto_renew_user: root
certbot_auto_renew_hour: "3"
certbot_auto_renew_minute: "30"
certbot_auto_renew_options: "--quiet"
certbot_create_command: >-
  {{ certbot_script }} certonly --webroot
  --webroot-path {{ cert_item.webroot | default(certbot_webroot) }}
  --noninteractive --agree-tos --register-unsafely-without-email
  --cert-name {{ cert_item_name }}
  -d {{ cert_item.domains | join(',') }}
certbot_certs:
  - name: "{{ deploy_domain }}"
    webroot: "{{ certbot_webroot }}"
    domains: "{{ deploy_domains }}"
