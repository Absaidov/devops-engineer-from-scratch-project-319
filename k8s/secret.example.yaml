apiVersion: v1
kind: Secret
metadata:
  name: bulletins-secrets
  namespace: bulletins
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: jdbc:postgresql://db.example:6432/bulletins?sslmode=require
  SPRING_DATASOURCE_USERNAME: replace-me
  SPRING_DATASOURCE_PASSWORD: replace-me
  STORAGE_S3_BUCKET: replace-me
  STORAGE_S3_ACCESSKEY: replace-me
  STORAGE_S3_SECRETKEY: replace-me

# This file documents the Secret schema only. Do not put real credentials here.
# `make k8s-secret` reads the values from Lockbox and creates this Secret in the
# cluster without writing its payload to the repository.
