apiVersion: v1
kind: Secret
metadata:
  name: bulletins-secrets
  namespace: bulletins
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: jdbc:postgresql://db.example:6432/bulletins?sslmode=require
  SPRING_DATASOURCE_USERNAME: replace-me
  SPRING_DATASOURCE_PASSWORD: replace-me
  STORAGE_S3_BUCKET: replace-me
  STORAGE_S3_ACCESSKEY: replace-me
  STORAGE_S3_SECRETKEY: replace-me
  ROTATION_MARKER: replace-me

# This file documents the generated Secret schema only. Do not apply it and do
# not put real credentials here. ExternalSecret `bulletins` continuously reads
# the payload from Yandex Lockbox and maintains this Secret in the cluster.
