apiVersion: v1
kind: ConfigMap
metadata:
  name: bulletins-config
  namespace: bulletins
  labels:
    app.kubernetes.io/name: bulletins
    app.kubernetes.io/component: application
data:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8080"
  MANAGEMENT_SERVER_PORT: "9090"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: "true"
  MANAGEMENT_METRICS_TAGS_APPLICATION: bulletins
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_OUTPUT_ANSI_ENABLED: "never"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: INFO
  LOGGING_LEVEL_IO_HEXLET_PROJECT_DEVOPS_DEPLOY: INFO
  STORAGE_S3_ENDPOINT: https://storage.yandexcloud.net
  STORAGE_S3_REGION: ru-central1
  JAVA_OPTS: >-
    -XX:MaxRAMPercentage=70.0
    -XX:+ExitOnOutOfMemoryError
