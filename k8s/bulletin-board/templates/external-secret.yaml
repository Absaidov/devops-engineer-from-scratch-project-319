{{- if .Values.externalSecret.enabled }}
{{- $remoteSecretID := required "externalSecret.remoteSecretId must contain the Yandex Lockbox secret ID" .Values.externalSecret.remoteSecretId }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "bulletin-board.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bulletin-board.labels" . | nindent 4 }}
spec:
  refreshPolicy: {{ .Values.externalSecret.refreshPolicy }}
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "bulletin-board.secretName" . }}
    creationPolicy: {{ .Values.externalSecret.target.creationPolicy }}
    deletionPolicy: {{ .Values.externalSecret.target.deletionPolicy }}
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          {{- include "bulletin-board.labels" . | nindent 10 }}
      data:
        SPRING_DATASOURCE_URL: '{{ `{{ printf "jdbc:postgresql://%s:%s/%s?sslmode=require&targetServerType=master&loadBalanceHosts=true" .dbHost .dbPort .dbName }}` }}'
        SPRING_DATASOURCE_USERNAME: '{{ `{{ .dbUser }}` }}'
        SPRING_DATASOURCE_PASSWORD: '{{ `{{ .dbPassword }}` }}'
        STORAGE_S3_BUCKET: '{{ `{{ .s3Bucket }}` }}'
        STORAGE_S3_ACCESSKEY: '{{ `{{ .s3AccessKey }}` }}'
        STORAGE_S3_SECRETKEY: '{{ `{{ .s3SecretKey }}` }}'
        ROTATION_MARKER: '{{ `{{ .rotationMarker }}` }}'
  data:
    - secretKey: dbHost
      remoteRef:
        key: {{ $remoteSecretID | quote }}
        property: DB_HOST
    - secretKey: dbPort
      remoteRef:
        key: {{ $remoteSecretID | quote }}
        property: DB_PORT
    - secretKey: dbName
      remoteRef:
        key: {{ $remoteSecretID | quote }}
        property: DB_NAME
    - secretKey: dbUser
      remoteRef:
        key: {{ $remoteSecretID | quote }}
        property: DB_USER
    - secretKey: dbPassword
      remoteRef:
        key: {{ $remoteSecretID | quote }}
        property: DB_PASSWORD
    - secretKey: s3Bucket
      remoteRef:
        key: {{ $remoteSecretID | quote }}
        property: S3_BUCKET
    - secretKey: s3AccessKey
      remoteRef:
        key: {{ $remoteSecretID | quote }}
        property: S3_ACCESS_KEY
    - secretKey: s3SecretKey
      remoteRef:
        key: {{ $remoteSecretID | quote }}
        property: S3_SECRET_KEY
    - secretKey: rotationMarker
      remoteRef:
        key: {{ $remoteSecretID | quote }}
        property: ROTATION_MARKER
{{- end }}
