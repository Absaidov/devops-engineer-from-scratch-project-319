{{- if and .Values.secret.create .Values.externalSecret.enabled }}
{{- fail "secret.create and externalSecret.enabled cannot both be true" }}
{{- end }}
{{- if .Values.secret.create }}
{{- if empty .Values.secret.stringData }}
{{- fail "secret.stringData must contain values when secret.create=true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bulletin-board.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bulletin-board.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key := keys .Values.secret.stringData | sortAlpha }}
  {{ $key }}: {{ index $.Values.secret.stringData $key | quote }}
  {{- end }}
{{- end }}
