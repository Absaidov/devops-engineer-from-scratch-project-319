apiVersion: v1
kind: Service
metadata:
  name: bulletins
  namespace: bulletins
  labels:
    app.kubernetes.io/name: bulletins
    app.kubernetes.io/component: application
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bulletins
    app.kubernetes.io/component: application
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: management
      port: 9090
      targetPort: management
      protocol: TCP

